name: tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "pytest.ini"
      - "data/processed/**"
      - "alignscore_scaffold/src/**"
      - "alignscore_scaffold/scripts/**"
      - "alignscore_scaffold/tests/**"
      - "alignscore_scaffold/requirements-core.txt"
      - "alignscore_scaffold/notebooks/**"
      - "alignscore_scaffold/data/processed/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "pytest.ini"
      - "data/processed/**"
      - "alignscore_scaffold/src/**"
      - "alignscore_scaffold/scripts/**"
      - "alignscore_scaffold/tests/**"
      - "alignscore_scaffold/requirements-core.txt"
      - "alignscore_scaffold/notebooks/**"
      - "alignscore_scaffold/data/processed/**"
  workflow_dispatch:

jobs:
  root-baseline:
    name: Root TF-IDF baseline / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install root dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run sample CLI
        run: python scripts/run_baseline.py --input data/processed/sample_claim_evidence.jsonl --output /tmp/sample_predictions.csv

  alignscore-scaffold-tests:
    name: AlignScore scaffold unit tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: alignscore_scaffold
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install scaffold test dependencies
        run: python -m pip install -r requirements-core.txt
      - name: Run scaffold unit tests
        run: python -m pytest -q tests
